name: Release
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

env:
  GIT_BRANCH: ${{ github.ref_type == 'branch' && github.ref_name || 'release' }}
  BUILD_TYPE: RelWithDebInfo

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-13]
        arch: [x64, x86]
        include:
          - os: windows-latest
            arch: x86
            CMAKE_ARCH_FLAG: -A Win32
          - os: ubuntu-22.04
            arch: x86
            CMAKE_CXX_FLAGS: -m32
            CMAKE_C_FLAGS: -m32
        exclude:
          - os: macos-13
            arch: x86

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ startsWith(matrix.os, 'macos-') }}

    steps:
      - uses: lukka/get-cmake@latest

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: 'recursive'

      - name: Install dependencies Ubuntu x86
        if: ${{ startsWith(matrix.os, 'ubuntu-') && matrix.arch == 'x86' }}
        run: |
          sudo apt update
          sudo apt install gcc-multilib g++-multilib

      - name: Download garrysmod_common
        uses: actions/checkout@v4
        with:
          repository: danielga/garrysmod_common
          ref: ${{ matrix.arch == 'x64' && 'x86-64-support-sourcesdk' || 'master' }}
          submodules: recursive
          path: third-party/garrysmod_common

      - name: Download CMake overlay for garrysmod_common
        uses: actions/checkout@v4
        with:
          repository: dankmolot/garrysmod_common
          ref: ${{ matrix.arch == 'x64' && 'x86-64-cmake' || 'master-cmake' }}
          submodules: recursive
          path: third-party/garrysmod_common_cmake_overlay

      - name: Apply CMake overlay
        shell: bash
        run: |
          set -euo pipefail
          OVERLAY="third-party/garrysmod_common_cmake_overlay"
          TARGET="third-party/garrysmod_common"

          cp "$OVERLAY/CMakeLists.txt" "$TARGET/CMakeLists.txt"
          rm -rf "$TARGET/cmake"
          cp -R "$OVERLAY/cmake" "$TARGET/cmake"

          while IFS= read -r -d '' file; do
            rel="${file#"$OVERLAY/"}"
            [[ "$rel" == "CMakeLists.txt" ]] && continue
            [[ "$rel" == cmake/* ]] && continue
            target_file="$TARGET/$rel"
            if [[ ! -f "$target_file" ]]; then
              mkdir -p "$(dirname "$target_file")"
              cp "$file" "$target_file"
            fi
          done < <(find "$OVERLAY" -type f -name CMakeLists.txt -print0)

      - name: Resolve gm_rdb version
        id: resolve_version
        shell: bash
        run: |
          set -euo pipefail
          TAG=""
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="$(git describe --tags --exact-match 2>/dev/null || true)"
          fi

          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION=""
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Configure project
        shell: bash
        env:
          RESOLVED_GM_RDB_VERSION: ${{ steps.resolve_version.outputs.version }}
        run: |
          set -euo pipefail
          CMAKE_ARGS=(
            ${{matrix.CMAKE_ARCH_FLAG}}
            -B build
            -DGARRYSMOD_COMMON_PATH=third-party/garrysmod_common
            -DAUTOINSTALL=.
            -DGIT_BRANCH=${{env.GIT_BRANCH}}
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
          )
          if [[ -n "${{ matrix.CMAKE_CXX_FLAGS }}" ]]; then
            CMAKE_ARGS+=(-DCMAKE_CXX_FLAGS="${{ matrix.CMAKE_CXX_FLAGS }}")
          fi
          if [[ -n "${{ matrix.CMAKE_C_FLAGS }}" ]]; then
            CMAKE_ARGS+=(-DCMAKE_C_FLAGS="${{ matrix.CMAKE_C_FLAGS }}")
          fi
          if [[ -n "$RESOLVED_GM_RDB_VERSION" ]]; then
            CMAKE_ARGS+=("-DGM_RDB_VERSION=$RESOLVED_GM_RDB_VERSION")
          fi
          cmake "${CMAKE_ARGS[@]}"

      - name: Build project
        run: cmake --build build -j -t rdb rdb_client --config ${{env.BUILD_TYPE}}

      - name: Find and copy binaries
        shell: bash
        run: |
          # Find all binary files (.dll for Windows/macOS Garry's Mod modules, .so for Linux)
          # AUTINSTALL copies them to root, but also check build directories
          mkdir -p output
          find . -maxdepth 1 \( -name '*.dll' -o -name '*.so' \) -exec cp {} output/ \; 2>/dev/null || true
          find build \( -name '*.dll' -o -name '*.so' \) -exec cp {} output/ \; 2>/dev/null || true
          ls -la output/

      - name: Verify client module is present
        shell: bash
        run: |
          if ! find output -maxdepth 1 -type f -name 'gmcl_rdb*' | grep -q .; then
            echo "Expected gmcl_rdb artifact was not produced."
            exit 1
          fi

      - name: Strip debug information from binaries and keep them outside (Ubuntu)
        if: ${{ startsWith(matrix.os, 'ubuntu-') }}
        run: |
          find output \( -name '*.dll' -o -name '*.so' \) -exec objcopy --only-keep-debug {} {}.pdb \;
          find output \( -name '*.dll' -o -name '*.so' \) -exec objcopy --strip-debug {} \;
          find output \( -name '*.dll' -o -name '*.so' \) -exec objcopy --add-gnu-debuglink {}.pdb {} \;

      - name: "Upload artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: ${{matrix.os}}-${{matrix.arch}}-${{env.BUILD_TYPE}}
          path: output/*
          if-no-files-found: error

  create_release:
    name: Create Release & Upload Assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get tag
        id: get_tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            # For manual runs or release events, get the latest tag
            TAG=$(git describe --tags --abbrev=0)
          fi

          # Check if release already exists for this tag
          BASE_TAG="$TAG"
          SUFFIX_CHAR="abcdefghijklmnopqrstuvwxyz"
          SUFFIX_IDX=0
          while gh release view "$TAG" --repo "${{ github.repository }}" &>/dev/null; do
            TAG="${BASE_TAG}${SUFFIX_CHAR:$SUFFIX_IDX:1}"
            SUFFIX_IDX=$((SUFFIX_IDX + 1))
          done

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using tag: $TAG"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect binary files
        run: |
          mkdir -p release
          find artifacts \( -name '*.dll' -o -name '*.so' \) -exec cp {} release/ \;
          ls -lah release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: gm_rdb ${{ steps.get_tag.outputs.tag }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: release/*

